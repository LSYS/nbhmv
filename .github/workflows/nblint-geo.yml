name: Geo notebooks lint

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - geo/*.ipynb
  pull_request:
    branches: ["main"]
    paths:
      - geo/*.ipynb

jobs:
  lint-notebooks:
    name: NBQA lint (.ipynb)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install NBQA + project deps
        run: |
          python -m pip install --upgrade pip
          pip install -r assets/requirements.txt

      # ------------------------------------------------------------------
      # pyflakes via nbqa (selected notebooks)
      # ------------------------------------------------------------------
      - name: nbqa pyflakes
        run: |
          NOTEBOOKS="\
            geo/pa-price.ipynb \
            geo/bootstrap-r2.ipynb \
            geo/get-devicecount-subzone-day.ipynb \
            geo/choropleth-devices.ipynb \
            geo/choropleth-income.ipynb \
            geo/choropleth-price.ipynb \
            geo/borders.ipynb \
            geo/lower-vs-higher-ptiles.ipynb \
            geo/cbd.ipynb \
            geo/conn-map.ipynb \
            geo/ping-variation.ipynb"
          nbqa pyflakes $NOTEBOOKS

      # ------------------------------------------------------------------
      # black --check via nbqa (same notebooks)
      # ------------------------------------------------------------------
      - name: nbqa black
        run: |
          NOTEBOOKS="\
            geo/pa-price.ipynb \
            geo/bootstrap-r2.ipynb \
            geo/get-devicecount-subzone-day.ipynb \
            geo/choropleth-devices.ipynb \
            geo/choropleth-income.ipynb \
            geo/choropleth-price.ipynb \
            geo/borders.ipynb \
            geo/lower-vs-higher-ptiles.ipynb \
            geo/cbd.ipynb \
            geo/conn-map.ipynb \
            geo/ping-variation.ipynb"
          nbqa black --check $NOTEBOOKS